[project]
name = "ai-server"
version = "0.1.0"
description = "本地 RAG 知识库问答服务（Ollama + bge-m3，全部本地推理）"
readme = "../README.md"
requires-python = ">=3.13"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 存储
    "lancedb>=0.17",
    "pyarrow>=17",
    "numpy>=2.0",
    # 检索
    "fastembed>=0.4",
    "jieba>=0.42",
    "bm25s>=0.2",
    # 文档解析
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "ruff>=0.8",
]
