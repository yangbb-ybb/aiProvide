[project]
name = "ai-server"
version = "0.1.0"
description = "本地 RAG 知识库问答服务（Ollama + Qwen3-Embedding，全部本地推理）"
readme = "../README.md"
# 锁死 3.13：onnxruntime（fastembed 的运行时）目前还没有 cp315 的 wheel，
# 而 brew 会把默认 python3 升级到最新版本，所以必须显式锁版本而不是写 >=3.13。
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # 存储
    "lancedb>=0.17",
    "pyarrow>=17",
    "numpy>=2.0",
    # 检索
    "fastembed>=0.4",
    "jieba>=0.42",
    "bm25s>=0.2",
    # 文档解析
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=1.0",
    "trafilatura>=2.0",
    "beautifulsoup4>=4.12",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "BLE"]
ignore = [
    # FastAPI 的依赖注入必须写在参数默认值里（Depends(...) 是框架约定，不是 bug）
    "B008",
    # 项目规范要求注释用中文，中文标点（全角逗号/括号）是刻意的
    "RUF001",
    "RUF002",
    "RUF003",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
]
